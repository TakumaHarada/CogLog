name: coglog
description: CogLog records exercise history from stationary bikes and supports weight loss.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0 <4.0.0"

workspace:
  - app
  - app/runner
  - app_packages/data/injection
  - app_packages/data/repository/exercise_history
  - app_packages/data/repository/exercise_history/_impl
  - app_packages/data/repository/exercise_history/_testing
  - app_packages/data/repository/top_screen_metric
  - app_packages/data/repository/top_screen_metric/_impl
  - app_packages/data/repository/top_screen_metric/_testing
  - app_packages/domain/exercise_history
  - app_packages/foundation/metadata
  - app_packages/foundation/resources

# 実効バージョンはここで揃える。子パッケージの依存は any。
dependency_overrides:
  flutter_lints: ^6.0.0
  flutter_riverpod: 3.4.3
  forui: ^0.27.7
  monolith_localization_runtime: ^1.1.0
  monolith_runner: ^1.0.2
  riverpod: 3.4.3
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_lints: any
  monolith_runner: any
