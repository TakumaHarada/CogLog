name: coglog
description: CogLog records exercise history from stationary bikes and supports weight loss.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0 <4.0.0"

workspace:
  - app
  - app/runner
  - app_packages/data/injection
  - app_packages/data/repository/exercise_history
  - app_packages/data/repository/exercise_history/_impl
  - app_packages/data/repository/exercise_history/_testing
  - app_packages/data/repository/top_screen_metric
  - app_packages/data/repository/top_screen_metric/_impl
  - app_packages/data/repository/top_screen_metric/_testing
  - app_packages/domain/exercise_history
  - app_packages/foundation/metadata
  - app_packages/foundation/resources
  - app_packages/screen/feature/exercise_history
  - app_packages/screen/feature/goal_settings
  - app_packages/screen/feature/main
  - app_packages/screen/feature/meter_capture
  - app_packages/screen/feature/top
  - app_packages/screen/injection
  - app_packages/screen/navigation
  - app_packages/screen/navigation/_go_router
  - app_packages/usecase/injection
  - app_packages/usecase/load_top_screen
  - app_packages/usecase/load_top_screen/_impl
  - app_packages/usecase/save_top_screen_metric
  - app_packages/usecase/save_top_screen_metric/_impl

# 実効バージョンはここで揃える。子パッケージの依存は any。
dependency_overrides:
  flutter_hooks: 0.21.3+1
  flutter_lints: ^6.0.0
  flutter_riverpod: 3.4.3
  forui: ^0.27.7
  go_router: 18.1.3
  hooks_riverpod: 3.4.3
  monolith_localization_runtime: ^1.1.0
  monolith_runner: ^1.0.2
  riverpod: 3.4.3
  shared_preferences: 2.5.6
  state_stream: 1.0.2
  state_stream_riverpod: 2.0.1

dev_dependencies:
  flutter_lints: any
  monolith_runner: any
